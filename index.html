<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src https://hook.eu1.make.com; form-action 'none'; base-uri 'none'">
<title>Wassta.AI | سجّل في الاختبار</title>
<style>
  :root {
    --bg: #EEF3F1;
    --paper: #FFFFFF;
    --ink: #10201C;
    --muted: #4B605A;
    --line: #C3D4CE;
    --green: #0B5B4F;
    --green-deep: #08423A;
    --on-green: #FFFFFF;
    --red: #C8302B;
    --error-bg: #FBEAE9;
    --ok-bg: #E2F1EC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1613;
      --paper: #16221F;
      --ink: #E8F0ED;
      --muted: #9FB4AD;
      --line: #2E403B;
      --green: #2FA38E;
      --green-deep: #5CC4AF;
      --on-green: #06251F;
      --red: #F0605A;
      --error-bg: #3A1F1E;
      --ok-bg: #173229;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "SF Arabic", "Geeza Pro", "Noto Naskh Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.75;
  }
  html[lang="it"] body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 38rem; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .brand { font-weight: 800; font-size: 1.25rem; letter-spacing: 0; color: var(--green-deep); }
  .brand i { font-style: normal; color: var(--red); }
  .lang {
    font: inherit; font-size: 0.95rem; color: var(--green-deep); background: transparent;
    border: 1.5px solid var(--line); border-radius: 999px; padding: 0.25rem 0.9rem; cursor: pointer; min-height: 2.5rem;
  }
  h1 { font-size: clamp(1.9rem, 7vw, 2.7rem); line-height: 1.3; margin: 0 0 0.75rem; font-weight: 800; }
  h2 { font-size: 1.3rem; margin: 2.25rem 0 0.75rem; font-weight: 800; }
  p { margin: 0 0 1rem; }
  .lead { font-size: 1.15rem; color: var(--muted); max-width: 32rem; }

  /* The one memorable element: an Italian letter turning into an Arabic explanation. */
  .letter { margin: 1.5rem 0 0.5rem; }
  .letter svg { width: 100%; height: auto; max-width: 26rem; display: block; margin-inline: auto; }
  .stamp { transform-origin: 232px 62px; transform: rotate(-14deg); animation: stamp 0.55s ease-out both; animation-delay: 0.2s; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.7) rotate(-18deg); } to { opacity: 1; transform: scale(1) rotate(-14deg); } }
  @media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }

  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; border-inline-start: 3px solid var(--green); }
  ol.steps li { counter-increment: s; position: relative; padding: 0.35rem 1.1rem 0.35rem 0; margin-inline-start: 1rem; }
  ol.steps li::before { content: counter(s); font-weight: 800; color: var(--green-deep); margin-inline-end: 0.6rem; }
  .keep { margin-top: 1rem; padding: 0.75rem 1rem; border-inline-start: 3px solid var(--red); background: var(--paper); font-size: 1rem; }

  form { background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 1.25rem; }
  .field { margin-bottom: 1.1rem; }
  label { display: block; font-weight: 700; margin-bottom: 0.25rem; }
  .hint { color: var(--muted); font-size: 0.95rem; margin: 0.15rem 0 0.4rem; line-height: 1.5; }
  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%; min-height: 3rem; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 0.5rem 0.8rem;
  }
  input[type="tel"], input[type="email"] { direction: ltr; text-align: start; }
  html[dir="rtl"] input[type="tel"], html[dir="rtl"] input[type="email"] { text-align: right; }
  input:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible, .check input:focus-visible {
    outline: 3px solid var(--green); outline-offset: 2px;
  }
  .check { display: flex; gap: 0.7rem; align-items: flex-start; margin-bottom: 1rem; }
  .check input { width: 1.4rem; height: 1.4rem; margin: 0.3rem 0 0; flex: none; accent-color: var(--green); }
  .check span { font-size: 1rem; line-height: 1.6; }
  .err { color: var(--red); font-size: 0.95rem; margin: 0.3rem 0 0; min-height: 0; }
  input[aria-invalid="true"] { border-color: var(--red); }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); opacity: 0; }
  button.submit {
    width: 100%; min-height: 3.25rem; font: inherit; font-size: 1.1rem; font-weight: 800; cursor: pointer;
    color: var(--on-green); background: var(--green); border: 0; border-radius: 8px; margin-top: 0.25rem;
  }
  button.submit[disabled] { opacity: 0.6; cursor: progress; }
  .status { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 8px; background: var(--error-bg); display: none; }
  .status.show { display: block; }
  .done { padding: 1.25rem; border-radius: 10px; background: var(--ok-bg); border: 1.5px solid var(--green); display: none; }
  .done.show { display: block; }
  .done strong { display: block; font-size: 1.2rem; margin-bottom: 0.3rem; }
  details { margin: 0.25rem 0 1.1rem; border-top: 1px solid var(--line); padding-top: 0.75rem; }
  summary { cursor: pointer; font-weight: 700; color: var(--green-deep); }
  details ul { margin: 0.6rem 0 0; padding-inline-start: 1.2rem; font-size: 0.97rem; line-height: 1.7; }
  a { color: var(--green-deep); }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Wassta<i>.</i>AI</div>
    <button type="button" class="lang" id="lang-btn" aria-label="Language / اللغة">Italiano</button>
  </div>

  <main>
    <section>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>

      <div class="letter" aria-hidden="true">
        <svg viewBox="0 0 320 210" role="img" focusable="false">
          <rect x="22" y="14" width="190" height="150" rx="6" style="fill:var(--paper);stroke:var(--line);stroke-width:2"/>
          <rect x="40" y="34" width="86" height="8" rx="3" style="fill:var(--line)"/>
          <rect x="40" y="54" width="150" height="6" rx="3" style="fill:var(--line)"/>
          <rect x="40" y="70" width="140" height="6" rx="3" style="fill:var(--line)"/>
          <rect x="40" y="86" width="150" height="6" rx="3" style="fill:var(--line)"/>
          <rect x="40" y="102" width="96" height="6" rx="3" style="fill:var(--line)"/>
          <rect x="40" y="124" width="150" height="6" rx="3" style="fill:var(--line)"/>
          <rect x="40" y="140" width="70" height="6" rx="3" style="fill:var(--line)"/>
          <g class="stamp">
            <circle cx="232" cy="62" r="34" style="fill:none;stroke:var(--red);stroke-width:3"/>
            <circle cx="232" cy="62" r="28" style="fill:none;stroke:var(--red);stroke-width:1.2"/>
            <text x="232" y="58" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--red)">اختبار</text>
            <text x="232" y="75" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--red)">مغلق</text>
          </g>
          <rect x="96" y="146" width="206" height="52" rx="8" style="fill:var(--green)"/>
          <rect x="196" y="160" width="86" height="7" rx="3.5" style="fill:var(--on-green);opacity:0.95"/>
          <rect x="140" y="174" width="142" height="6" rx="3" style="fill:var(--on-green);opacity:0.7"/>
          <rect x="188" y="186" width="94" height="6" rx="3" style="fill:var(--on-green);opacity:0.7"/>
        </svg>
      </div>
    </section>

    <section>
      <h2 data-i="steps_title"></h2>
      <ol class="steps">
        <li data-i="s1"></li>
        <li data-i="s2"></li>
        <li data-i="s3"></li>
        <li data-i="s4"></li>
      </ol>
      <p class="keep" data-i="keep"></p>
    </section>

    <section id="form-section">
      <h2 data-i="form_title"></h2>
      <form id="signup" novalidate>
        <div class="field">
          <label for="name" data-i="f_name"></label>
          <input type="text" id="name" name="name" autocomplete="name" maxlength="80" aria-describedby="e-name">
          <p class="err" id="e-name" role="alert"></p>
        </div>
        <div class="field">
          <label for="phone" data-i="f_phone"></label>
          <p class="hint" data-i="h_phone" id="h-phone"></p>
          <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" maxlength="25" placeholder="+39 333 123 4567" aria-describedby="h-phone e-phone">
          <p class="err" id="e-phone" role="alert"></p>
        </div>
        <div class="field">
          <label for="email" data-i="f_email"></label>
          <p class="hint" data-i="h_email" id="h-email"></p>
          <input type="email" id="email" name="email" inputmode="email" autocomplete="email" maxlength="120" placeholder="name@gmail.com" aria-describedby="h-email e-email">
          <p class="err" id="e-email" role="alert"></p>
        </div>

        <div class="check">
          <input type="checkbox" id="android" name="android">
          <span><label for="android" style="font-weight:400;margin:0" data-i="c_android"></label><span class="err" id="e-android" role="alert" style="display:block"></span></span>
        </div>
        <div class="check">
          <input type="checkbox" id="consent" name="consent">
          <span><label for="consent" style="font-weight:400;margin:0" data-i="c_consent"></label><span class="err" id="e-consent" role="alert" style="display:block"></span></span>
        </div>

        <details>
          <summary data-i="n_title"></summary>
          <ul id="notice"></ul>
        </details>

        <!-- Honeypot: hidden from people, bots tend to fill it. -->
        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="submit" id="submit" data-i="submit"></button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>

      <div class="done" id="done" role="status" aria-live="polite">
        <strong data-i="ok_title"></strong>
        <span data-i="ok_text"></span>
      </div>
    </section>
  </main>

  <footer>
    <p data-i="foot"></p>
    <p><a href="/wassta-privacy/" data-i="policy"></a></p>
  </footer>
</div>

<script>
(function () {
  // Make webhook that appends the sign-up to the private Google Sheet.
  var ENDPOINT = 'https://hook.eu1.make.com/69s3g9pwzy03nn8p3wsb7svv8sp97hbu';

  var T = {
    ar: {
      h1: 'جرّب Wassta.AI قبل ما يوصل لكل الناس',
      lead: 'تطبيق بيشرحلك الأوراق والخطابات الإيطالية بالعربي. محتاجين ناس على موبايل أندرويد يجرّبوه معانا 14 يوم.',
      steps_title: 'إزاي بيمشي الاختبار',
      s1: 'سجّل بياناتك في النموذج اللي تحت.',
      s2: 'هنبعتلك رابط الانضمام على واتساب لما الاختبار يفتح.',
      s3: 'تنزّل التطبيق من Google Play وتستخدمه من وقت للتاني.',
      s4: 'تقولنا إيه اللي عجبك وإيه اللي مش واضح.',
      keep: 'ما تخرجش من برنامج الاختبار ولا تحذف التطبيق خلال الـ 14 يوم، لأن Google بتحسب الأيام كده.',
      form_title: 'سجّل بياناتك',
      f_name: 'الاسم', f_phone: 'رقم واتساب', f_email: 'إيميل Gmail',
      h_phone: 'ابدأ بكود الدولة، مثلاً +39 لإيطاليا.',
      h_email: 'نفس الإيميل المسجّل على موبايل الأندرويد، لأن Google Play بتفتح الاختبار بيه.',
      c_android: 'عندي موبايل أندرويد وهستخدمه في الاختبار.',
      c_consent: 'أوافق إن بياناتي (الاسم والواتساب والإيميل) تُستخدم للتواصل معايا بخصوص اختبار التطبيق فقط، وإن إيميلي يتضاف لقائمة المختبرين في Google Play.',
      n_title: 'تفاصيل حماية البيانات',
      notice: [
‎        'المسؤول عن البيانات: Fahd Moustafa Elnahas Elhassan Ali، wassta.app@gmail.com.',
‎        'الغرض: التواصل معاك بخصوص اختبار Wassta.AI، وإضافة إيميلك لقائمة المختبرين في Google Play.',
‎        'الأساس: موافقتك. تقدر تسحبها في أي وقت بإيميل على العنوان ده.',
‎        'الحفظ: في جدول خاص على Google Drive. النموذج بيعدّي على خدمة Make (المنطقة الأوروبية) قبل ما يوصل للجدول، وبنحذف بياناتك خلال 30 يوم من انتهاء الاختبار.',
‎        'حقوقك: الاطلاع والتصحيح والحذف والاعتراض، وتقديم شكوى لـ Garante per la Protezione dei Dati Personali.',
‎        'السياسة الكاملة: <a href="/wassta-privacy/">سياسة الخصوصية</a>.'
      ],
      submit: 'سجّلني في الاختبار', sending: 'جاري التسجيل...',
      ok_title: 'تم تسجيلك في الاختبار.',
      ok_text: 'هنتواصل معاك على واتساب لما الاختبار يبدأ.',
      e_name: 'اكتب اسمك (حرفين على الأقل).',
      e_phone: 'اكتب رقم واتساب صحيح، ويبدأ بكود الدولة.',
      e_email: 'اكتب إيميل صحيح.',
      e_android: 'الاختبار لموبايلات أندرويد بس.',
      e_consent: 'لازم توافق على استخدام بياناتك عشان نقدر نسجّلك.',
      e_net: 'ما قدرناش نسجّلك. اتأكد من الإنترنت وجرّب تاني.',
      e_setup: 'صفحة التسجيل لسه ما اتربطتش بقائمة المختبرين.',
      foot: 'Wassta.AI تطبيق إرشادي وليس بديلاً عن الجهات الرسمية.',
      policy: 'سياسة الخصوصية', btn: 'Italiano'
    },
    it: {
      h1: 'Prova Wassta.AI prima di tutti',
      lead: "Un'app che spiega in arabo documenti e lettere italiane. Cerchiamo persone con un telefono Android che la provino per 14 giorni.",
      steps_title: 'Come funziona il test',
      s1: 'Compila il modulo qui sotto.',
      s2: "Ti scriviamo su WhatsApp con il link d'invito quando il test parte.",
      s3: "Scarichi l'app da Google Play e la usi ogni tanto.",
      s4: "Ci dici cosa ti è piaciuto e cosa non è chiaro.",
      keep: "Non uscire dal programma di test e non disinstallare l'app per 14 giorni: Google conta i giorni così.",
      form_title: 'Registrati',
      f_name: 'Nome', f_phone: 'Numero WhatsApp', f_email: 'Email Gmail',
      h_phone: 'Inizia con il prefisso internazionale, ad esempio +39 per l’Italia.',
      h_email: "La stessa email dell'account del telefono Android: Google Play apre il test con quella.",
      c_android: 'Ho un telefono Android e lo userò per il test.',
      c_consent: "Acconsento all'uso dei miei dati (nome, WhatsApp, email) solo per contattarmi riguardo al test dell'app e all'inserimento della mia email nell'elenco dei tester su Google Play.",
      n_title: 'Dettagli sulla protezione dei dati',
      notice: [
        'Titolare del trattamento: Fahd Moustafa Elnahas Elhassan Ali, wassta.app@gmail.com.',
        "Finalità: contattarti per il test di Wassta.AI e inserire la tua email nell'elenco dei tester su Google Play.",
        'Base giuridica: il tuo consenso, revocabile in qualsiasi momento con una email a questo indirizzo.',
        'Conservazione: in un foglio privato su Google Drive. Il modulo passa attraverso il servizio Make (zona europea) prima di arrivare al foglio; cancelliamo i dati entro 30 giorni dalla fine del test.',
        'Diritti: accesso, rettifica, cancellazione, opposizione e reclamo al Garante per la Protezione dei Dati Personali.',
        'Informativa completa: <a href="/wassta-privacy/">Informativa sulla privacy</a>.'
      ],
      submit: 'Iscrivimi al test', sending: 'Invio in corso...',
      ok_title: 'Sei iscritto al test.',
      ok_text: 'Ti scriviamo su WhatsApp quando il test parte.',
      e_name: 'Scrivi il tuo nome (almeno 2 caratteri).',
      e_phone: 'Scrivi un numero WhatsApp valido, con il prefisso internazionale.',
      e_email: 'Scrivi un indirizzo email valido.',
      e_android: 'Il test è solo per telefoni Android.',
      e_consent: 'Devi acconsentire all’uso dei dati per poterti iscrivere.',
      e_net: 'Non siamo riusciti a iscriverti. Controlla la connessione e riprova.',
      e_setup: 'Il modulo non è ancora collegato all’elenco dei tester.',
      foot: 'Wassta.AI è un’app informativa e non sostituisce gli enti ufficiali.',
      policy: 'Informativa sulla privacy', btn: 'العربية'
    }
  };

  // Arabic is always the default. Italian only via the button or ?lang=it
  var lang = (new URLSearchParams(location.search).get('lang') === 'it') ? 'it' : 'ar';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('signup');

  function t(k) { return T[lang][k]; }

  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = 'Wassta.AI | ' + (lang === 'ar' ? 'سجّل في الاختبار' : 'Iscriviti al test');
    var nodes = document.querySelectorAll('[data-i]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i'));
    $('lang-btn').textContent = t('btn');
    var ul = $('notice'); ul.innerHTML = '';
    t('notice').forEach(function (line) {
      var li = document.createElement('li'); li.innerHTML = line; ul.appendChild(li);
    });
    $('submit').textContent = t('submit');
  }

  function setErr(field, key) {
    var el = $('e-' + field), input = $(field);
    el.textContent = key ? t(key) : '';
    if (input && input.type !== 'checkbox') input.setAttribute('aria-invalid', key ? 'true' : 'false');
  }
  function status(msg) { var s = $('status'); s.textContent = msg || ''; s.className = 'status' + (msg ? ' show' : ''); }

  function validate(d) {
    var first = null;
    function bad(field, key) { setErr(field, key); if (!first) first = field; }
    ['name', 'phone', 'email', 'android', 'consent'].forEach(function (f) { setErr(f, null); });
    if (d.name.length < 2) bad('name', 'e_name');
    if (!/^\+?[0-9 ()-]{7,20}$/.test(d.phone)) bad('phone', 'e_phone');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) bad('email', 'e_email');
    if (d.android !== 'yes') bad('android', 'e_android');
    if (d.consent !== 'yes') bad('consent', 'e_consent');
    return first;
  }

  $('lang-btn').addEventListener('click', function () { lang = lang === 'ar' ? 'it' : 'ar'; render(); });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    status('');
    var d = {
      name: $('name').value.trim(),
      phone: $('phone').value.trim(),
      email: $('email').value.trim().toLowerCase(),
      android: $('android').checked ? 'yes' : 'no',
      consent: $('consent').checked ? 'yes' : 'no',
      website: $('website').value
    };
    var firstBad = validate(d);
    if (firstBad) { $(firstBad).focus(); return; }
    if (ENDPOINT.indexOf('PASTE_') === 0) { status(t('e_setup')); return; }

    var btn = $('submit');
    btn.disabled = true; btn.textContent = t('sending');
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: new URLSearchParams(d).toString()
    }).then(function () {
      form.style.display = 'none';
      $('done').className = 'done show';
      $('done').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }).catch(function () {
      btn.disabled = false; btn.textContent = t('submit');
      status(t('e_net'));
    });
  });

  render();
})();
</script>
</body>
</html>
